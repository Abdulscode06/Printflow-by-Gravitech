# Netlify Configuration for PrintFlow AI Frontend

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Proxy API calls directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://printflow-ai.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback rule for React Single Page Apps
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
